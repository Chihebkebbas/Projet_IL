version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: togetherplay
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # In Docker, frontend & backend share the same origin → localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
      MONGODB_URI: ${MONGODB_URI}
      YT_API_KEY: ${YT_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
